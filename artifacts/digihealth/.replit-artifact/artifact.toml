kind = "mobile"
previewPath = "/"
title = "UNZA DigiHealth"
version = "1.0.0"
id = "artifacts/digihealth"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 19483

[services.development]
run = "pnpm --filter @workspace/digihealth run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digihealth", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/digihealth", "run", "serve" ]

[services.env]
PORT = "19483"
BASE_PATH = "/"
