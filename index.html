<body>
  <div id="root">
    <div id="initial-loader" class="initial-loader" role="status" aria-live="polite">
      <div class="initial-loader-content">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loader-text">
          <div class="flag-mask" style="font-size: clamp(24px, 6vw, 64px);">DigiHealth</div>
          <div style="color:var(--app-text-soft); margin-top:8px; font-size:14px;">Starting app…</div>
        </div>
      </div>
    </div>
  </div>
  <!-- Dev-only minimal console filter: suppress known extension noise early -->
  <script>
    (function () {
      try {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isLocal) return;
        var re = /contentscript|inpage|MetaMask|chrome-extension:\/\//i;
        ['error', 'warn', 'info', 'log'].forEach(function (method) {
          var orig = console[method] && console[method].bind(console);
          if (!orig) return;
          console[method] = function () {
            try {
              for (var i = 0; i < arguments.length; i++) {
                var a = arguments[i];
                if (typeof a === 'string' && re.test(a)) return;
                if (a && typeof a.message === 'string' && re.test(a.message)) return;
              }
            } catch (e) { }
            orig.apply(console, arguments);
          };
        });
      } catch (e) { }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
